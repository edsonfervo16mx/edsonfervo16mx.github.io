<style>
/* ═════════════ Tokens ═════════════ */
:root{
  --bg:#fafaf9;
  --surface:#ffffff;
  --text:#1c1917;
  --muted:#6b6560;
  --faint:#a8a29e;
  --line:#e7e5e4;
  --accent:#0f766e;
  --ok:#16a34a;

  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --col:720px;
  --gutter:clamp(16px,5vw,32px);
  --nav-h:56px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e0d;--surface:#161615;--text:#ecebe9;--muted:#a19d98;--faint:#6b6763;
    --line:#262524;--accent:#5eead4;--ok:#4ade80;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e0d;--surface:#161615;--text:#ecebe9;--muted:#a19d98;--faint:#6b6763;
  --line:#262524;--accent:#5eead4;--ok:#4ade80;color-scheme:dark;
}

/* ═════════════ Base ═════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 24px);-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font:400 16px/1.65 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
ul{list-style:none}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

.wrap{max-width:var(--col);margin:0 auto;padding:0 var(--gutter)}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:-.01em}
.muted{color:var(--muted)}

/* ═════════════ Nav ═════════════ */
.nav{
  position:sticky;top:0;z-index:10;height:var(--nav-h);
  background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .wrap{height:100%;display:flex;align-items:center;gap:24px}
.nav-brand{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.nav.scrolled .nav-brand{opacity:1;transform:none}
.nav-links{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  font-size:14px;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap;
  transition:color .15s,background .15s;
}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--text);background:var(--line)}
.icon-btn{
  flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:6px;
  border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;
  transition:color .15s,border-color .15s;
}
.icon-btn:hover{color:var(--text);border-color:var(--faint)}
.icon-btn svg{width:16px;height:16px}

/* ═════════════ Hero ═════════════ */
.hero{padding:72px 0 56px}
.hero-top{display:flex;align-items:center;gap:16px;margin-bottom:32px}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--line);filter:grayscale(.15)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
h1{font-size:clamp(34px,6vw,48px);font-weight:600;line-height:1.05;letter-spacing:-.035em}
.title{margin-top:12px;font-size:clamp(17px,2.4vw,19px);color:var(--muted);line-height:1.45;letter-spacing:-.01em;max-width:560px}
.bio{margin-top:28px;color:var(--text);max-width:620px}
.meta{margin-top:20px;display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);font-size:14px}
.actions{margin-top:32px;display:flex;flex-wrap:wrap;gap:10px}
.btn{
  display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;
  font:500 14px var(--sans);cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text);
  transition:border-color .15s,transform .15s;
}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-primary:hover{border-color:var(--text);opacity:.88}
.btn svg{width:15px;height:15px}

.stats{
  margin-top:56px;display:grid;grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.stat{padding:20px 0}
.stat + .stat{padding-left:20px;border-left:1px solid var(--line)}
.stat-v{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1}
.stat-l{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.3}

/* ═════════════ Sections ═════════════ */
section.block{padding:56px 0;border-top:1px solid var(--line)}
.hero + section.block{border-top:0;padding-top:24px}
.sec-label{
  font-family:var(--mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;
  color:var(--faint);margin-bottom:28px;
}

/* row: left meta column + right content */
.row{display:grid;grid-template-columns:132px 1fr;gap:4px 24px;padding:16px 0}
.row + .row{border-top:1px dashed var(--line)}
.row-meta{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px;white-space:nowrap}
.row-title{font-weight:500;letter-spacing:-.01em}
.row-title .sep{color:var(--faint);margin:0 6px;font-weight:400}
.row-sub{color:var(--muted);font-size:15px}
.hl{margin-top:8px}
.hl li{position:relative;padding-left:16px;font-size:15px;line-height:1.55;margin-top:4px}
.hl li::before{content:'';position:absolute;left:0;top:11px;width:6px;height:1px;background:var(--faint)}
.project p.aud{margin-top:12px;font-size:13px;color:var(--faint)}
.tags{margin-top:8px;font-family:var(--mono);font-size:12.5px;color:var(--muted);line-height:1.7}
.tags span + span::before{content:'·';margin:0 7px;color:var(--faint)}
.now{
  display:inline-block;margin-left:8px;padding:1px 7px;border-radius:99px;vertical-align:2px;
  font:500 11px var(--mono);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
}

/* projects */
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.project{background:var(--bg);padding:22px 22px 24px}
.project h3{font-size:16px;font-weight:500;letter-spacing:-.01em}
.project p{margin-top:6px;font-size:14px;color:var(--muted);line-height:1.55}
.project ul{margin-top:12px}
.project li{font-size:14px;color:var(--muted);padding:3px 0 3px 16px;position:relative}
.project li::before{content:'';position:absolute;left:0;top:13px;width:6px;height:1px;background:var(--faint)}

/* contact */
.contact-lead{font-size:clamp(22px,3.6vw,28px);font-weight:500;letter-spacing:-.025em;line-height:1.25;max-width:520px}
.links{margin-top:28px}
.links a{
  display:flex;align-items:baseline;gap:16px;padding:14px 0;border-top:1px solid var(--line);
  transition:padding .2s,color .15s;
}
.links li:last-child a{border-bottom:1px solid var(--line)}
.links .p{width:116px;flex:none;font-family:var(--mono);font-size:13px;color:var(--muted)}
.links .h{font-weight:500}
.links .arrow{margin-left:auto;color:var(--faint);transition:transform .2s,color .15s}
.links a:hover{padding-left:6px}
.links a:hover .h{color:var(--accent)}
.links a:hover .arrow{color:var(--accent);transform:translate(2px,-2px)}

footer{padding:40px 0 56px;color:var(--faint);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* entrance */
.fade{opacity:0;transform:translateY(8px);animation:in .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none}}

.loading{min-height:60vh;display:grid;place-items:center;color:var(--faint)}

/* ═════════════ Responsive ═════════════ */
@media (max-width:640px){
  .hero{padding:48px 0 40px}
  .nav-brand{display:none}
  .nav-links{margin-left:-10px;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);padding-right:24px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3){padding-left:0;border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .row{grid-template-columns:1fr;padding:18px 0}
  .row-meta{order:-1}
  .projects{grid-template-columns:1fr}
  .links .p{width:88px}
  section.block{padding:44px 0}
}

/* ═════════════ Print / PDF CV ═════════════ */
@media print{
  @page{margin:14mm 14mm 16mm}
  :root{--bg:#fff;--surface:#fff;--text:#111;--muted:#444;--faint:#888;--line:#ddd;--accent:#111;color-scheme:light}
  body{font-size:10.5pt;line-height:1.45}
  .nav,.actions,.no-print{display:none!important}
  .fade{opacity:1;transform:none;animation:none}
  .wrap{max-width:none;padding:0}
  .hero{padding:0 0 14px}
  .hero-top{margin-bottom:12px}
  .avatar{width:44px;height:44px}
  h1{font-size:24pt}
  .title{font-size:12pt;margin-top:4px}
  .bio{margin-top:12px}
  .meta{margin-top:8px}
  .stats{margin-top:16px}
  .stat{padding:8px 0}.stat-v{font-size:16pt}
  section.block{padding:16px 0}
  .sec-label{margin-bottom:8px;color:#666}
  .row{padding:7px 0;break-inside:avoid}
  .project{padding:10px 12px;break-inside:avoid}
  .projects{border-radius:0}
  .contact-lead{display:none}
  .links{margin-top:0}
  .links a{padding:6px 0}
  .links .h::after{content:' — ' attr(data-url);font-weight:400;color:var(--muted);font-size:9pt}
  .links .arrow{display:none}
  footer{padding:12px 0 0}
}
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap">
    <a href="#top" class="nav-brand" id="brand"></a>
    <nav class="nav-links" id="nav-links" aria-label="Sections"></nav>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle color theme" title="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="app">
  <div class="loading mono">Loading…</div>
</main>

<script>
(function(){
  'use strict';

  /* ── helpers ── */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const tags = list => `<div class="tags">${list.map(x => `<span>${esc(x)}</span>`).join('')}</div>`;
  const fmtPeriod = p => esc(p).replace(/\s*-\s*/, ' — ');
  const isCurrent = p => /present/i.test(p || '');
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  const DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5M5 20h14"/></svg>';

  const SECTIONS = [
    { id:'services',   label:'Services'   },
    { id:'experience', label:'Experience' },
    { id:'projects',   label:'Projects'   },
    { id:'awards',     label:'Awards'     },
    { id:'skills',     label:'Skills'     },
    { id:'contact',    label:'Contact'    },
  ];

  /* ── section renderers ── */
  function hero(p){
    return `
    <section class="hero fade" id="top">
      <div class="hero-top">
        <img class="avatar" src="${esc(p.avatar)}" alt="${esc(p.name)}" width="56" height="56"/>
        <span class="status">${esc(p.status)}</span>
      </div>
      <h1>${esc(p.name)}</h1>
      <p class="title">${esc(p.title)}</p>
      <p class="bio">${esc(p.description)}</p>
      <div class="meta"><span>${esc(p.location)}</span></div>
      <div class="actions">
        <a class="btn btn-primary" href="#contact">Get in touch</a>
        <a class="btn" href="#projects">View projects</a>
        <button class="btn" type="button" id="print">${DL}Download CV</button>
      </div>
      <div class="stats">
        ${(p.stats || []).map(s => `
          <div class="stat"><div class="stat-v">${esc(s.value)}</div><div class="stat-l">${esc(s.label)}</div></div>`).join('')}
      </div>
    </section>`;
  }

  function experience(list){
    return `
    <section class="block fade" id="experience" style="animation-delay:.05s">
      <h2 class="sec-label">Experience</h2>
      ${list.map(e => `
        <div class="row">
          <div class="row-meta">${fmtPeriod(e.period)}</div>
          <div>
            <div class="row-title">${esc(e.company)}${isCurrent(e.period) ? '<span class="now">Now</span>' : ''}</div>
            <div class="row-sub">${esc(e.role)}</div>
            ${e.highlights && e.highlights.length ? `<ul class="hl">${e.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}
            ${e.skills && e.skills.length ? tags(e.skills.map(s => s.label)) : ''}
          </div>
        </div>`).join('')}
    </section>`;
  }

  function services(list){
    if (!list.length) return '';
    return `
    <section class="block fade" id="services" style="animation-delay:.05s">
      <h2 class="sec-label">Services</h2>
      <div class="projects">
        ${list.map(s => `
          <article class="project">
            <h3>${esc(s.title)}</h3>
            <p>${esc(s.description)}</p>
            ${s.audience ? `<p class="aud">${esc(s.audience)}</p>` : ''}
          </article>`).join('')}
      </div>
    </section>`;
  }

  function projects(list){
    return `
    <section class="block" id="projects">
      <h2 class="sec-label">Projects</h2>
      <div class="projects">
        ${list.map(pr => `
          <article class="project">
            <h3>${esc(pr.title)}</h3>
            ${pr.description ? `<p>${esc(pr.description)}</p>` : ''}
            <ul>${(pr.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>
          </article>`).join('')}
      </div>
    </section>`;
  }

  function awards(list){
    // "Event name, 2017" → { event, year }; newest first
    const rows = list.map(a => {
      const m = String(a.description).match(/^(.*?),\s*(\d{4})\s*$/);
      return { title:a.title, event: m ? m[1] : a.description, year: m ? m[2] : '' };
    }).sort((a, b) => (b.year || 0) - (a.year || 0));
    return `
    <section class="block" id="awards">
      <h2 class="sec-label">Awards &amp; Recognition</h2>
      ${rows.map(a => `
        <div class="row">
          <div class="row-meta">${esc(a.year)}</div>
          <div><span class="row-title">${esc(a.title)}</span><span class="row-sub"> — ${esc(a.event)}</span></div>
        </div>`).join('')}
    </section>`;
  }

  function skills(list){
    return `
    <section class="block" id="skills">
      <h2 class="sec-label">Skills</h2>
      ${list.map(c => `
        <div class="row">
          <div class="row-meta" style="white-space:normal">${esc(c.category)}</div>
          <div class="row-sub" style="color:var(--text)">${(c.items || []).map(i => esc(i.label)).join(', ')}</div>
        </div>`).join('')}
    </section>`;
  }

  function contact(list){
    return `
    <section class="block" id="contact">
      <h2 class="sec-label">Contact</h2>
      <p class="contact-lead">Open to new collaborations, ventures, and conversations.</p>
      <ul class="links">
        ${list.map(c => `
          <li><a href="${esc(c.url)}" target="_blank" rel="noopener">
            <span class="p">${esc(c.platform)}</span>
            <span class="h" data-url="${esc(c.url.replace(/^https?:\/\/(www\.)?/, ''))}">${esc(c.handle)}</span>
            <span class="arrow">${ARROW}</span>
          </a></li>`).join('')}
      </ul>
    </section>`;
  }

  /* ── render ── */
  async function init(){
    const app = document.getElementById('app');
    let data;
    try {
      const res = await fetch('./data.json', { cache:'no-cache' });
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
    } catch (err) {
      app.innerHTML = '<div class="loading mono">Could not load content. Please refresh.</div>';
      return;
    }

    const p = data.profile;
    document.getElementById('brand').textContent = p.name;
    document.getElementById('nav-links').innerHTML =
      SECTIONS.map(s => `<a href="#${s.id}" data-id="${s.id}">${s.label}</a>`).join('');

    app.innerHTML =
      hero(p) +
      services(data.services || []) +
      experience(data.experience || []) +
      projects(data.projects || []) +
      awards(data.awards || []) +
      skills(data.skills || []) +
      contact(data.contact || []) +
      `<footer><span>© ${new Date().getFullYear()} ${esc(p.name)}</span><span>${esc(p.location)}</span></footer>`;

    document.getElementById('print').addEventListener('click', () => window.print());
    wireNav();
  }

  /* ── nav: border on scroll + active section ── */
  function wireNav(){
    const nav = document.getElementById('nav');
    const links = [...document.querySelectorAll('#nav-links a')];
    const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 120);
    window.addEventListener('scroll', onScroll, { passive:true });
    onScroll();

    const setActive = id => links.forEach(a => {
      const on = a.dataset.id === id;
      a.classList.toggle('active', on);
      if (on) { const box = a.parentElement; box.scrollTo({ left: a.offsetLeft - box.clientWidth / 2 + a.clientWidth / 2, behavior:'smooth' }); }
    });
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting && window.scrollY > 120) setActive(e.target.id); });
    }, { rootMargin:'-45% 0px -50% 0px' });
    SECTIONS.forEach(s => { const el = document.getElementById(s.id); if (el) obs.observe(el); });
    window.addEventListener('scroll', () => { if (window.scrollY <= 120) setActive(null); }, { passive:true });
  }

  /* ── theme toggle ── */
  document.getElementById('theme').addEventListener('click', () => {
    const root = document.documentElement;
    const isDark = root.dataset.theme
      ? root.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = isDark ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  init();
})();
</script>
</body>
</html>
